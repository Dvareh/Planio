<div class="register">
  <div class="card">
    <h1>Register</h1>

    <form class="form" (ngSubmit)="onSubmit()">
      <div class="group">
        <label for="username">Username</label>
        <input
          id="username"
          type="text"
          name="username"
          [(ngModel)]="username"
          required
        />
      </div>

      <div class="group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          name="email"
          [(ngModel)]="email"
          required
        />
      </div>

      <div class="group">
        <label for="password">Password</label>
        <input
          id="password"
          type="password"
          name="password"
          [(ngModel)]="password"
          minlength="8"
          required
        />
      </div>

      @if (errorMessage) {
        <p class="error">{{ errorMessage }}</p>
      }

      <button type="submit">Register</button>
    </form>
  </div>
</div>
