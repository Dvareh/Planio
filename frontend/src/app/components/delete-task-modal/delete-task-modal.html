<div class="modal-backdrop">

  <div class="modal">

    <h2>Delete Task</h2>

    <p>
      Are you sure you want to delete "{{ taskTitle }}"?
    </p>

    @if (errorMessage) {
      <p>{{ errorMessage }}</p>
    }

    <div class="modal-actions">

      <button type="button" (click)="closeModal()" [disabled]="isDeleting">
        Cancel
      </button>

      <button type="button" (click)="deleteTask()" [disabled]="isDeleting">
        @if (isDeleting) {
          Deleting...
        } @else {
          Delete
        }
      </button>

    </div>

  </div>

</div>
