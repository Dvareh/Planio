<div class="modal-backdrop">

  <div class="modal">

    <h2>Create Task</h2>

    <label>
      Title
      <input type="text" [(ngModel)]="task.title">
    </label>

    <label>
      Description
      <textarea [(ngModel)]="task.description"></textarea>
    </label>

    <label>
      Due date
      <input type="date" [(ngModel)]="task.dueDate">
    </label>

    <label>
      Status

      <select [(ngModel)]="task.status">
        <option value="TODO">TODO</option>
        <option value="IN_PROGRESS">IN PROGRESS</option>
        <option value="DONE">DONE</option>
        <option value="CANCELLED">CANCELLED</option>
      </select>
    </label>

    <label>
      Priority

      <select [(ngModel)]="task.priority">
        <option value="LOW">Low</option>
        <option value="MEDIUM">Medium</option>
        <option value="HIGH">High</option>
        <option value="URGENT">Urgent</option>
      </select>
    </label>

    @if (errorMsg) {
      <p>{{ errorMsg }}</p>
    }

    <div class="modal-actions">

      <button type="button" (click)="closeModal()">
        Cancel
      </button>

      <button type="button" (click)="createTask()">
        Create
      </button>

    </div>

  </div>

</div>
