<header class="header">
  <h1>Planio</h1>

  @if (currentUser) {
    <div>
      <span>{{ currentUser.name }}</span>

      <button type="button" (click)="openNotifications()">
        Notifications

        @if (unreadNotifications > 0) {
          <span>
             : {{ unreadNotifications }}
          </span>
        }
      </button>
    </div>
  }

  <button type="button" (click)="logout()">Logout</button>
</header>
